[project]
name = "django-project"
version = "0.1.0"
description = "SILLAGE — кураторський магазин нішевої парфумерії"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "pillow>=12.3.0",
    "django-environ>=0.14.0",
    "numpy>=2.0",
    "xhtml2pdf>=0.2.17",
    "requests>=2.32",
    "django-ratelimit>=4.1",
    "django-redis>=6.0",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "django-debug-toolbar>=7.1.1",
    "django-extensions>=4.1",
    "factory-boy>=3.3.3",
    "ruff>=0.14.6",
    "black>=25.11.0",
    "coverage>=7.6",
]

# ---------------------------------------------------------------------------
# Ruff — лінтер
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "DJ",   # flake8-django
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",   # довжину рядка контролює formatter
    # DJ012 вимагає свій порядок членів моделі й конфліктує з конвенцією
    # проєкту: __str__ → save() → get_absolute_url() → решта.
    # Приватний хелпер лишається поруч із save(), який його викликає.
    "DJ012",
]

[tool.ruff.lint.per-file-ignores]
# Пакет налаштувань живе на зірочкових імпортах — це штатний патерн Django.
"shop_project/settings/*.py" = ["F403", "F405", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "cart", "orders", "payments", "shop", "shop_project"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

# ---------------------------------------------------------------------------
# Black — форматер
# ---------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py312"]
# У проєкті скрізь одинарні лапки — не перевертаємо їх на подвійні.
skip-string-normalization = true
extend-exclude = '''
/(
  | \.venv
  | migrations
  | staticfiles
)/
'''

# ---------------------------------------------------------------------------
# Coverage — покриття тестами
# ---------------------------------------------------------------------------
#
#   coverage run manage.py test
#   coverage report          # таблиця в консоль
#   coverage html            # htmlcov/index.html

[tool.coverage.run]
source = ["accounts", "cart", "orders", "payments", "shop", "shop_project", "testing"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    # Точки входу серверів: у тестах не виконуються за визначенням.
    "shop_project/asgi.py",
    "shop_project/wsgi.py",
    # Prod-налаштування імпортуються в окремому процесі
    # (shop_project/tests/test_prod_settings.py), і coverage їх не бачить.
    "shop_project/settings/prod.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
sort = "Cover"
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
