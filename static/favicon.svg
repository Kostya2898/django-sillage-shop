<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Іконка — не логотип у мініатюрі, а його слід.

    Вордмарк «Sillage» у 16 пікселях перетворюється в сіру смужку, тому тут
    лишилася одна літера й одна риска під нею: на вкладці читається «S»,
    а риска тримає форму, коли браузер малює іконку в 16×16.

    Кольори продубльовані значеннями: SVG підвантажується як окремий файл
    і не бачить ні `tokens.css`, ні змінних сторінки. Це та сама межа
    рушія, що й у `theme-color`.
  -->
  <rect width="32" height="32" fill="#0a090c"/>
  <text x="16" y="21" fill="#c8a45c" font-family="Georgia, 'Times New Roman', serif"
        font-size="19" text-anchor="middle">S</text>
  <rect x="9" y="25" width="14" height="1" fill="#c8a45c" opacity="0.55"/>
</svg>
