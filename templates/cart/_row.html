{% load catalogue %}
{# Одна позиція кошика. Використовується і на сторінці кошика, і в drawer. #}
<li class="cart-row" data-product="{{ item.product.id }}">
    {% if item.product.main_image %}
        <img class="cart-row__image" src="{{ item.product.main_image.url }}"
             alt="{{ item.product.main_image_alt }}" loading="lazy" width="56" height="70">
    {% else %}
        <span class="cart-row__image cart-row__image--empty"></span>
    {% endif %}

    <div class="cart-row__body">
        <a class="cart-row__name" href="{{ item.product.get_absolute_url }}">{{ item.product.name }}</a>
        <p class="cart-row__brand">{{ item.product.brand.name }}</p>

        <form class="cart-row__qty" method="post"
              action="{% url 'cart:cart_update' item.product.id %}">
            {% csrf_token %}
            <input type="number" name="quantity" value="{{ item.quantity }}"
                   min="0" max="{{ max_quantity|default:99 }}"
                   aria-label="Кількість «{{ item.product.name }}»">
            <button type="submit" class="btn btn-sm btn-outline-secondary">Оновити</button>
        </form>
    </div>

    <div class="cart-row__side">
        <span class="cart-row__total">{{ item.total_price|money }} ₴</span>
        <form method="post" action="{% url 'cart:cart_remove' item.product.id %}">
            {% csrf_token %}
            <button type="submit" class="cart-row__remove" aria-label="Видалити «{{ item.product.name }}»">
                Видалити
            </button>
        </form>
    </div>
</li>
